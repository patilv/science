    .font-fact { font-family: 'Caveat', cursive; }

    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      z-index: 999; background: #020617; transition: opacity 0.4s;
    }
    #boot .ring {
      width: 64px; height: 64px; border-radius: 50%;
      border: 3px solid rgba(251,191,36,0.2);
      border-top-color: #fbbf24;
      animation: spin 0.9s linear infinite;

      margin-top: 18px; font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.3em; font-size: 11px; color: #fcd34d;

    @media (max-width: 640px) {
      .stat-chip { padding: 4px 8px !important; }

      .header-pad { padding-top: 10px !important; padding-bottom: 6px !important; }
    }

    .custom-scroll::-webkit-scrollbar-track { background: rgba(15,23,42,0.4); border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(251,191,36,0.4); border-radius: 4px; }

    @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
    .animate-fadein { animation: fadein .25s ease-out }
    @keyframes slideup {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-slideup { animation: slideup .35s cubic-bezier(0.2, 0.7, 0.3, 1); }
    @keyframes slidein {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .animate-slidein { animation: slidein .3s ease-out; }
    @keyframes xpfloat {
      0%   { opacity: 0; transform: translate(-50%, 10px) scale(0.85); }
      20%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
      80%  { opacity: 1; transform: translate(-50%, -8px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -28px) scale(0.95); }
    }
    .animate-xpfloat { animation: xpfloat 1.4s ease-out forwards; }
    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.8); }
      50%      { opacity: .9;  transform: scale(1.2); }
    }
    .animate-twinkle { animation: twinkle 4s ease-in-out infinite; }

    .perspective-card { perspective: 1000px; }
    .transform-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    const { useState, useEffect, useRef, useMemo, useLayoutEffect } = React;

    function L({ name, className = '', size = 24, strokeWidth = 2, ...rest }) {
      const ref = useRef(null);
      useLayoutEffect(() => {
        if (!ref.current || !window.lucide) return;
        const lib = window.lucide;
        const node = lib.icons && lib.icons[name];
        if (!node) return;
        const svg = lib.createElement(node);
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        svg.setAttribute('stroke-width', strokeWidth);
        if (className) svg.setAttribute('class', className);
        ref.current.replaceChildren(svg);
      }, [name, size, strokeWidth, className]);
      return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', verticalAlign: 'middle' }} />;
    }

function Stat({ icon: Icon, label, value, color }) {
  return (
    <div className="stat-chip flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-700/60">
      <Icon className={`w-4 h-4 ${color}`} />
      <div className="leading-tight">
        <div className="stat-label text-[10px] uppercase tracking-widest text-slate-500">{label}</div>
        <div className={`stat-value font-display text-sm ${color}`}>{value}</div>
      </div>
    </div>
  );
}

function Section({ icon: Icon, title, children, color = 'text-amber-300' }) {
  return (
    <div>
      <div className="flex items-center gap-2 mb-1.5">
        <Icon className={`w-4 h-4 ${color}`} />
        <h3 className={`font-display text-xs tracking-[0.2em] uppercase ${color}`}>{title}</h3>
      </div>
      {children}
    </div>
  );
}

      </button>

        {round && <div className="text-sm text-slate-400">Round <span className="font-display text-amber-300">{round}/{total}</span></div>}

function App() {
  const [tab, setTab] = useState('map');
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [xp, setXp] = useState(0);
  const [discovered, setDiscovered] = useState(new Set());
  const [gamesWon, setGamesWon] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);
  const [orderedPerfectly, setOrderedPerfectly] = useState(0);
  const [gravityChecks, setGravityChecks] = useState(0);
  const [unlockedAchievements, setUnlockedAchievements] = useState(new Set());
  const [toast, setToast] = useState(null);
  const [activeGame, setActiveGame] = useState(null);
  const [xpFloater, setXpFloater] = useState(null);
  const [hydrated, setHydrated] = useState(false);
  const [installPrompt, setInstallPrompt] = useState(null);

  const STORAGE_KEY = 'solar-voyager-v1';
  const state = { xp, discovered, gamesWon, bestStreak, orderedPerfectly, gravityChecks };
  const level = xpToLevel(xp);
  const lvlPct = xpInLevel(xp);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (typeof d.xp === 'number') setXp(d.xp);
        if (Array.isArray(d.discovered)) setDiscovered(new Set(d.discovered));
        if (typeof d.gamesWon === 'number') setGamesWon(d.gamesWon);
        if (typeof d.bestStreak === 'number') setBestStreak(d.bestStreak);
        if (typeof d.orderedPerfectly === 'number') setOrderedPerfectly(d.orderedPerfectly);
        if (typeof d.gravityChecks === 'number') setGravityChecks(d.gravityChecks);
        if (Array.isArray(d.unlocked)) setUnlockedAchievements(new Set(d.unlocked));
      }
    } catch {}
    setHydrated(true);
  }, []);

  useEffect(() => {
    if (!hydrated) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        xp, discovered:[...discovered], gamesWon, bestStreak, orderedPerfectly, gravityChecks,
        unlocked:[...unlockedAchievements]
      }));
    } catch {}
  }, [hydrated, xp, discovered, gamesWon, bestStreak, orderedPerfectly, gravityChecks, unlockedAchievements]);

  useEffect(() => {
    ACHIEVEMENTS.forEach(a => {
      if (!unlockedAchievements.has(a.id) && a.check(state)) {
        setUnlockedAchievements(prev => new Set(prev).add(a.id));
        setToast({ name:a.name, desc:a.desc, icon:a.icon });
        setTimeout(() => setToast(null), 4200);
      }
    });
  }, [xp, discovered, gamesWon, bestStreak, orderedPerfectly, gravityChecks]);

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener('beforeinstallprompt', handler);
    window.addEventListener('appinstalled', () => setInstallPrompt(null));
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const installApp = async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    setInstallPrompt(null);
  };

  const grantXp = (amount, reason='') => {
    setXp(x => x + amount);
    setXpFloater({ amount, reason, id: Date.now() });
    setTimeout(() => setXpFloater(null), 1400);
  };

  const openBody = el => {
    setSelected(el);
    if (!discovered.has(el.id)) {
      setDiscovered(prev => new Set(prev).add(el.id));
      grantXp(5, `Discovered ${el.name}!`);
    }
  };

  const resetProgress = () => {
    if (!confirm('Reset all progress? This cannot be undone.')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    setXp(0); setDiscovered(new Set()); setGamesWon(0); setBestStreak(0);
    setOrderedPerfectly(0); setGravityChecks(0); setUnlockedAchievements(new Set());
  };

  const filteredBodies = useMemo(() => {
    return BODIES.filter(b => {
      if (filter !== 'all' && b.cat !== filter) return false;
      if (search) {
        const q = search.toLowerCase();
        return b.name.toLowerCase().includes(q) || b.cat.toLowerCase().includes(q);
      }
      return true;
    });
  }, [filter, search]);

  return (
    <div className="min-h-screen w-full text-slate-100 relative overflow-x-hidden font-body">
      <BackgroundFx />
      <header className="relative z-10 border-b border-amber-400/20 bg-slate-950/60 backdrop-blur-xl">
        <div className="header-pad max-w-[1400px] mx-auto px-3 sm:px-6 py-4 flex flex-wrap items-center gap-3 sm:gap-4">
          <div className="flex items-center gap-3">
            <div className="relative w-10 h-10 sm:w-12 sm:h-12 grid place-items-center rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 shadow-[0_0_30px_rgba(251,191,36,0.55)]">
              <Sun className="w-5 h-5 sm:w-7 sm:h-7 text-slate-900" strokeWidth={2.5} />
              <span className="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-emerald-400 animate-pulse" />
            </div>
            <div>
              <h1 className="font-display text-lg sm:text-2xl tracking-[0.18em] leading-none bg-gradient-to-r from-amber-300 via-orange-300 to-fuchsia-300 bg-clip-text text-transparent">
                SOLAR VOYAGER
              </h1>
              <p className="text-[10px] sm:text-[11px] tracking-[0.3em] text-slate-400 mt-1">COSMIC EXPLORER</p>
            </div>
          </div>
          <div className="ml-auto flex items-center gap-2 sm:gap-5 flex-wrap">
            {installPrompt && (
              <button onClick={installApp}
                className="px-3 py-1.5 rounded-lg bg-gradient-to-r from-amber-500 to-fuchsia-500 text-slate-900 font-display text-xs tracking-widest flex items-center gap-1.5 shadow-[0_0_20px_rgba(251,191,36,0.4)] hover:scale-105 transition-transform">
                <Sparkles className="w-3.5 h-3.5" /> INSTALL
              </button>
            )}
            <Stat icon={Sparkles} label="XP"       value={xp}             color="text-amber-300" />
            <Stat icon={Star}     label="Level"    value={level}          color="text-orange-300" />
            <Stat icon={Orbit}    label="Found"    value={`${discovered.size}/${BODIES.length}`} color="text-emerald-300" />
            <Stat icon={Trophy}   label="Trophies" value={`${unlockedAchievements.size}/${ACHIEVEMENTS.length}`} color="text-fuchsia-300" />
          </div>
        </div>
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 pb-3">
          <div className="h-1.5 rounded-full bg-slate-800/80 overflow-hidden">
            <div className="h-full bg-gradient-to-r from-amber-400 via-orange-400 to-fuchsia-400 transition-all duration-700"
                 style={{ width: `${lvlPct}%` }} />
          </div>
        </div>
        <nav className="max-w-[1400px] mx-auto px-4 sm:px-6 pb-3 flex gap-2 flex-wrap">
          {[
            { id:'map',     label:'Solar Map',         icon:Orbit },
            { id:'list',    label:'List View',         icon:BookOpen },
            { id:'gravity', label:'Gravity Calc',      icon:Zap },
            { id:'games',   label:'Games',             icon:Target },
            { id:'trophy',  label:'Achievements',      icon:Trophy },
            { id:'about',   label:'How To Play',       icon:Lightbulb },
          ].map(t => (
            <button key={t.id} onClick={() => { setTab(t.id); setActiveGame(null); }}
              className={`group px-4 py-2 rounded-lg flex items-center gap-2 text-sm tracking-wider uppercase transition-all border ${
                tab === t.id
                  ? 'bg-amber-400/15 border-amber-400/60 text-amber-200 shadow-[0_0_20px_rgba(251,191,36,0.3)]'
                  : 'border-slate-700/60 text-slate-400 hover:text-slate-200 hover:border-slate-500'
              }`}>
              <t.icon className="w-4 h-4" />
              <span className="font-display text-xs">{t.label}</span>
            </button>
          ))}
        </nav>
      </header>
      <main className="relative z-10 max-w-[1400px] mx-auto px-2 sm:px-6 py-6">
        {tab === 'map' && <SolarMap bodies={BODIES} discovered={discovered} onSelect={openBody} />}
        {tab === 'list' && <ListView bodies={filteredBodies} filter={filter} setFilter={setFilter} search={search} setSearch={setSearch} discovered={discovered} onSelect={openBody} />}
        {tab === 'gravity' && <GravityCalculator onCheck={() => setGravityChecks(g => g + 1)} />}
        {tab === 'games' && !activeGame && <GamesHub onStart={setActiveGame} />}
        {tab === 'games' && activeGame === 'identify' && <IdentifyGame onExit={() => setActiveGame(null)} grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} bestStreak={bestStreak} setBestStreak={setBestStreak} />}
        {tab === 'games' && activeGame === 'detective' && <DetectiveGame onExit={() => setActiveGame(null)} grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} bestStreak={bestStreak} setBestStreak={setBestStreak} />}
        {tab === 'games' && activeGame === 'order' && <OrderGame onExit={() => setActiveGame(null)} grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} onPerfect={() => setOrderedPerfectly(o=>o+1)} />}
        {tab === 'games' && activeGame === 'memory' && <MemoryGame onExit={() => setActiveGame(null)} grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} />}
        {tab === 'trophy' && <AchievementsView state={state} unlocked={unlockedAchievements} />}
        {tab === 'about' && <AboutView resetProgress={resetProgress} />}
      </main>
      {selected && <BodyModal body={selected} onClose={() => setSelected(null)} />}
      {toast && <AchievementToast toast={toast} />}
      {xpFloater && (
        <div key={xpFloater.id} className="fixed top-24 left-1/2 -translate-x-1/2 z-[60] pointer-events-none">
          <div className="px-4 py-2 rounded-full bg-amber-500/95 text-slate-900 font-display tracking-wider text-sm shadow-[0_0_30px_rgba(251,191,36,0.7)] animate-xpfloat">
            +{xpFloater.amount} XP {xpFloater.reason && <span className="opacity-90 normal-case font-body ml-1">{xpFloater.reason}</span>}
          </div>
        </div>
      )}
    </div>
  );
}

function SolarMap({ bodies, discovered, onSelect }) {
  const W = 800, H = 600;
  const cx = W/2, cy = H/2;
  // Orbiting bodies sorted by orbit distance
  const orbiting = bodies.filter(b => b.orbit > 0 && b.cat !== 'comet' && b.cat !== 'mission');
  const others = bodies.filter(b => b.orbit === 0 || b.cat === 'comet' || b.cat === 'mission');
  const sun = bodies.find(b => b.id === 'sun');

  return (
    <div className="grid lg:grid-cols-[1fr_300px] gap-6">
      <div className="rounded-2xl bg-slate-950/40 border border-slate-700/40 p-2 sm:p-4 overflow-hidden">
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full block" style={{ maxHeight: '70vh' }}>
          <defs>
            <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="rgba(253,224,71,0.95)" />
              <stop offset="35%" stopColor="rgba(251,191,36,0.6)" />
              <stop offset="100%" stopColor="rgba(251,191,36,0)" />
            </radialGradient>
            <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="rgba(251,191,36,0.08)" />
              <stop offset="100%" stopColor="rgba(0,0,0,0)" />
            </radialGradient>
          </defs>
          <rect x="0" y="0" width={W} height={H} fill="#020617" />
          {/* Stars background */}
          {Array.from({length: 80}).map((_, i) => {
            const sx = (i * 137) % W;
            const sy = (i * 89) % H;
            const sr = ((i * 7) % 3) * 0.4 + 0.3;
            return <circle key={`star-${i}`} cx={sx} cy={sy} r={sr} fill="white" opacity="0.5" />;
          })}
          <circle cx={cx} cy={cy} r={W/2} fill="url(#bgGlow)" />

          {/* Orbit paths */}
          {orbiting.filter(b => b.cat !== 'moon').map((b) => {
            const r = 40 + b.orbit * 32;
            return <ellipse key={`o-${b.id}`} cx={cx} cy={cy} rx={r} ry={r*0.3} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="0.5" />;
          })}

          {/* Sun */}
          <g onClick={() => onSelect(sun)} style={{cursor: 'pointer'}}>
            <circle cx={cx} cy={cy} r={48} fill="url(#sunGlow)" />
            <circle cx={cx} cy={cy} r={sun.size} fill="#fbbf24">
              <animate attributeName="r" values={`${sun.size};${sun.size+1.5};${sun.size}`} dur="3s" repeatCount="indefinite" />
            </circle>
            {discovered.has(sun.id) && <circle cx={cx + sun.size*0.65} cy={cy - sun.size*0.65} r="3" fill="#34d399" stroke="#020617" strokeWidth="0.8" />}
          </g>

          {/* Orbiting bodies positioned at specific angles around the orbit */}
          {orbiting.map((b, i) => {
            const r = 40 + b.orbit * 32;
            // Spread bodies around the orbit so they don't overlap
            const angle = (i * 0.8 + 0.3) * Math.PI;
            const px = cx + r * Math.cos(angle);
            const py = cy + r * 0.3 * Math.sin(angle);
            const isMoon = b.cat === 'moon';
            return (
              <g key={b.id} onClick={() => onSelect(b)} style={{cursor: 'pointer'}}>
                <circle cx={px} cy={py} r={b.size + 4} fill={b.color} opacity="0.18" />
                <circle cx={px} cy={py} r={b.size} fill={b.color} stroke={discovered.has(b.id) ? '#34d399' : 'rgba(255,255,255,0.5)'} strokeWidth="0.8">
                  <animate attributeName="r" values={`${b.size};${b.size+0.5};${b.size}`} dur="2.5s" repeatCount="indefinite" />
                </circle>
                <text x={px} y={py + b.size + 9} textAnchor="middle" fill="rgba(255,255,255,0.85)" fontSize={isMoon ? "8" : "10"} fontFamily="Orbitron, sans-serif" style={{letterSpacing: '0.1em'}}>{b.name.toUpperCase()}</text>
                {discovered.has(b.id) && <circle cx={px + b.size*0.65} cy={py - b.size*0.65} r="2" fill="#34d399" stroke="#020617" strokeWidth="0.4" />}
              </g>
            );
          })}
        </svg>
        <div className="text-center mt-2 text-xs tracking-widest text-slate-500 font-display">TAP ANY BODY TO EXPLORE</div>
      </div>

      <div className="space-y-4">
        <div className="p-4 rounded-2xl bg-slate-900/60 border border-slate-700/50">
          <div className="font-display text-xs tracking-widest text-slate-400 mb-2">BEYOND THE PLANETS</div>
          <div className="space-y-2">
            {others.map(b => {
              const t = TYPES[b.cat];
              return (
                <button key={b.id} onClick={() => onSelect(b)}
                  className={`w-full p-2.5 rounded-lg text-left flex items-center gap-2 border transition bg-gradient-to-br ${t.tile} hover:scale-[1.02]`}>
                  <span className="text-2xl">{b.emoji}</span>
                  <div className="flex-1">
                    <div className="font-display text-sm text-white tracking-wide">{b.name}</div>
                    <div className="text-[9px] text-white/70 tracking-widest uppercase">{t.label}</div>
                  </div>
                  {discovered.has(b.id) && <Check className="w-4 h-4 text-emerald-300" strokeWidth={3} />}
                </button>
              );
            })}
          </div>
        </div>
        <div className="p-4 rounded-2xl bg-slate-900/60 border border-slate-700/50">
          <div className="font-display text-xs tracking-widest text-slate-400 mb-2">PROGRESS</div>
          <div className="text-3xl font-display text-amber-300">{discovered.size}<span className="text-slate-500">/{BODIES.length}</span></div>
          <div className="text-xs text-slate-400 mt-1">Bodies discovered</div>
          <div className="mt-3 space-y-1.5">
            {Object.entries(TYPES).map(([k, v]) => {
              const total = BODIES.filter(b => b.cat === k).length;
              if (total === 0) return null;
              const found = BODIES.filter(b => b.cat === k && discovered.has(b.id)).length;
              return (
                <div key={k} className="flex items-center justify-between text-xs">
                  <span className={v.text}><span className={`inline-block w-2 h-2 rounded-sm mr-1.5 align-middle ${v.dot}`} />{v.label}</span>
                  <span className="text-slate-500 font-mono">{found}/{total}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function ListView({ bodies, filter, setFilter, search, setSearch, discovered, onSelect }) {
  return (
    <div>
      <div className="mb-5 flex flex-wrap items-center gap-3">
        <div className="relative flex-1 min-w-[220px] max-w-md">

function BodyModal({ body, onClose }) {
  const t = TYPES[body.cat];
  useEffect(() => {
    const handle = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handle);
    return () => window.removeEventListener('keydown', handle);
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-50 grid place-items-center p-4 animate-fadein" onClick={onClose}>
      <div className="absolute inset-0 bg-slate-950/85 backdrop-blur-md" />
      <div onClick={e => e.stopPropagation()}
           className="relative w-full max-w-3xl bg-slate-900/95 border border-slate-700/60 rounded-2xl shadow-[0_0_60px_rgba(251,191,36,0.25)] overflow-hidden animate-slideup">

function IdentifyGame({ onExit, grantXp, onWin, bestStreak, setBestStreak }) {
  const ROUNDS = 6;
  const [round, setRound] = useState(0);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [puzzle, setPuzzle] = useState(null);
  const [picked, setPicked] = useState(null);

  useEffect(() => { newRound(); }, []);
  function newRound() {
    const factPool = BODIES.filter(b => b.fact);
    const answer = rand(factPool);
    const wrong = shuffle(factPool.filter(b => b.id !== answer.id)).slice(0, 3);
    setPuzzle({ answer, choices: shuffle([answer, ...wrong]) });
    setPicked(null);
  }
  function pick(b) {
    if (picked) return;
    setPicked(b);
    const right = b.id === puzzle.answer.id;
    if (right) {
      setScore(s => s + 1);
      const ns = streak + 1; setStreak(ns);
      if (ns > bestStreak) setBestStreak(ns);
      grantXp(15, 'Correct!');
    } else { setStreak(0); }
    setTimeout(() => {
      if (round + 1 >= ROUNDS) {
        if (score + (right ? 1 : 0) >= 4) onWin();
        setRound(ROUNDS);
      } else {
        setRound(r => r + 1); newRound();
      }
    }, 1500);
  }
  if (!puzzle) return null;
  if (round >= ROUNDS) {
    return <GameResult title="Mission Complete" score={score} total={`out of ${ROUNDS}`}
      message={score >= 4 ? 'Excellent astronomy!' : 'Good run. Keep exploring.'}
      onPlayAgain={() => { setRound(0); setScore(0); setStreak(0); newRound(); }} onExit={onExit} />;
  }
  return (
    <div>
      <GameHeader onExit={onExit} title="Cosmic Identifier" round={round+1} total={ROUNDS} score={score} streak={streak} />
      <div className="mt-6 max-w-3xl mx-auto">
        <div className="p-6 rounded-2xl bg-slate-900/70 border border-slate-700/60">
          <div className="text-xs tracking-widest text-amber-300 mb-3 font-display">WHICH BODY HAS THIS PROPERTY?</div>
          <p className="text-slate-100 text-lg leading-relaxed">{puzzle.answer.fact}</p>
        </div>
        <div className="mt-5 grid grid-cols-2 sm:grid-cols-4 gap-3">
          {puzzle.choices.map(c => {
            const t = TYPES[c.cat];
            const isAnswer = picked && c.id === puzzle.answer.id;
            const isWrong = picked && picked.id === c.id && c.id !== puzzle.answer.id;
            return (
              <button key={c.id} onClick={() => pick(c)} disabled={!!picked}
                className={`p-4 rounded-xl text-center transition-all border ${
                  picked ? (
                    isAnswer ? 'bg-emerald-500/30 border-emerald-400 scale-105' :
                    isWrong ? 'bg-red-500/30 border-red-400' :
                    'opacity-40 border-slate-700'
                  ) : `bg-gradient-to-br ${t.tile} border-transparent hover:scale-105`
                }`}>
                <div className="text-3xl">{c.emoji}</div>
                <div className="font-display text-base text-white mt-1">{c.name}</div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function OrderGame({ onExit, grantXp, onWin, onPerfect }) {
  const planets = PLANET_ORDER.map(id => BODIES.find(b => b.id === id));
  const [order, setOrder] = useState(() => shuffle(planets));
  const [submitted, setSubmitted] = useState(false);
  const [correct, setCorrect] = useState(0);

  function move(i, dir) {
    if (submitted) return;
    const ni = i + dir;
    if (ni < 0 || ni >= order.length) return;
    const next = [...order];
    [next[i], next[ni]] = [next[ni], next[i]];
    setOrder(next);
  }

  function submit() {
    let c = 0;
    order.forEach((p, i) => { if (p.id === PLANET_ORDER[i]) c++; });
    setCorrect(c);
    setSubmitted(true);
    grantXp(c * 10, `${c}/8 in correct position`);
    if (c === 8) { onWin(); onPerfect(); grantXp(50, 'PERFECT bonus!'); }
    else if (c >= 6) onWin();
  }

  function reset() {
    setOrder(shuffle(planets));
    setSubmitted(false); setCorrect(0);
  }

  return (
    <div>
      <GameHeader onExit={onExit} title="Order The Planets" extra={
        <div className="text-xs text-slate-400 font-display tracking-wider">CLOSEST → FARTHEST</div>
      } />
      <div className="mt-6 max-w-2xl mx-auto">
        <p className="text-slate-300 text-sm mb-4 text-center">Arrange the 8 planets from closest to the Sun (left) to farthest (right). Tap the arrows to swap positions.</p>
        <div className="space-y-2">
          {order.map((p, i) => {
            const t = TYPES[p.cat];
            const isCorrect = submitted && p.id === PLANET_ORDER[i];
            const isWrong = submitted && p.id !== PLANET_ORDER[i];
            return (
              <div key={p.id}
                className={`flex items-center gap-3 p-3 rounded-xl border transition-all bg-gradient-to-br ${t.tile} ${
                  isCorrect ? 'ring-2 ring-emerald-400 scale-[1.02]' :
                  isWrong ? 'ring-2 ring-red-400 opacity-70' : ''
                }`}>
                <div className="font-display text-lg text-white/80 w-6">{i+1}</div>
                <div className="text-3xl">{p.emoji}</div>
                <div className="flex-1">
                  <div className="font-display text-lg text-white">{p.name}</div>
                  {submitted && p.id !== PLANET_ORDER[i] && (
                    <div className="text-xs text-white/80">Correct position: {PLANET_ORDER.indexOf(p.id) + 1}</div>
                  )}
                </div>
                {!submitted && (
                  <div className="flex gap-1">
                    <button onClick={() => move(i, -1)} disabled={i === 0}
                      className="w-9 h-9 rounded-lg bg-black/30 hover:bg-black/50 disabled:opacity-30 grid place-items-center text-white">↑</button>
                    <button onClick={() => move(i, 1)} disabled={i === order.length - 1}
                      className="w-9 h-9 rounded-lg bg-black/30 hover:bg-black/50 disabled:opacity-30 grid place-items-center text-white">↓</button>
                  </div>
                )}
                {isCorrect && <Check className="w-5 h-5 text-emerald-300" strokeWidth={3} />}
              </div>
            );
          })}
        </div>
        <div className="mt-5 flex gap-3 justify-center">
          {!submitted ? (
            <button onClick={submit} className="px-6 py-3 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-900 font-display tracking-wider">
              SUBMIT ORDER
            </button>
          ) : (
            <>
              <div className={`px-6 py-3 rounded-lg font-display text-lg tracking-wider ${
                correct === 8 ? 'bg-emerald-500/30 text-emerald-200 border border-emerald-400'
                : correct >= 6 ? 'bg-amber-500/30 text-amber-200 border border-amber-400'
                : 'bg-slate-700 text-slate-300'
              }`}>
                {correct}/8 correct
              </div>
              <button onClick={reset} className="px-6 py-3 rounded-lg border border-slate-700 hover:border-amber-400/60 font-display text-sm tracking-wider">
                <RefreshCw className="w-4 h-4 inline mr-2" />Try Again

        </div>
        <div className="mt-4 text-center text-xs text-slate-500">Hint: My Very Educated Mother Just Served Us Noodles</div>
      </div>
    </div>
  );
}

function MemoryGame({ onExit, grantXp, onWin }) {
  const [cards, setCards] = useState([]);
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState(new Set());
  const [moves, setMoves] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => { reset(); }, []);
  function reset() {
    const picks = shuffle(BODIES).slice(0, 8);
    const sym = picks.map(b => ({ id:`s-${b.id}`, kind:'emoji', b }));
    const nm = picks.map(b => ({ id:`n-${b.id}`, kind:'name', b }));
    setCards(shuffle([...sym, ...nm]));
    setFlipped([]); setMatched(new Set()); setMoves(0); setDone(false);
  }
  function flip(card) {
    if (flipped.length === 2 || flipped.find(c => c.id === card.id) || matched.has(card.b.id)) return;
    const nf = [...flipped, card];
    setFlipped(nf);
    if (nf.length === 2) {
      setMoves(m => m + 1);
      const [a, b] = nf;
      if (a.b.id === b.b.id && a.kind !== b.kind) {
        const next = new Set(matched).add(a.b.id);
        setTimeout(() => {
          setMatched(next); setFlipped([]); grantXp(8, 'Match!');
          if (next.size === 8) {
            setDone(true); onWin();
            const bonus = Math.max(0, 15 - moves) * 5;
            if (bonus) grantXp(bonus, 'Efficiency bonus');
          }
        }, 600);
      } else {
        setTimeout(() => setFlipped([]), 900);
      }
    }
  }
  if (done) return <GameResult title="Memory Master!" score={moves} total="moves"
    message={moves <= 12 ? 'Photographic memory!' : 'Solid work.'}
    onPlayAgain={reset} onExit={onExit} />;
  return (
    <div>
      <GameHeader onExit={onExit} title="Cosmic Memory"
        extra={<div className="text-sm text-slate-300">Moves: <span className="font-display text-amber-300">{moves}</span></div>}
        score={`${matched.size}/8`} />
      <div className="mt-6 max-w-3xl mx-auto grid grid-cols-4 gap-2 sm:gap-3">
        {cards.map(card => {
          const isFlipped = flipped.find(c => c.id === card.id) || matched.has(card.b.id);
          const isMatched = matched.has(card.b.id);
          const t = TYPES[card.b.cat];
          return (
            <button key={card.id} onClick={() => flip(card)}
              className={`aspect-square rounded-xl transition-all duration-500 perspective-card ${isMatched ? 'opacity-60' : ''}`}>
              <div className={`relative w-full h-full transition-transform duration-500 transform-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                <div className="absolute inset-0 backface-hidden rounded-xl bg-slate-900/80 border border-slate-700/60 grid place-items-center hover:border-amber-400/50">
                  <Sparkles className="w-7 h-7 text-slate-600" />
                </div>
                <div className={`absolute inset-0 backface-hidden rotate-y-180 rounded-xl bg-gradient-to-br ${t.tile} grid place-items-center p-2`}>
                  {card.kind === 'emoji' ? <div className="text-4xl">{card.b.emoji}</div>
                    : <div className="text-center"><div className="font-display text-xs sm:text-sm text-white">{card.b.name}</div></div>}
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

                ? 'bg-gradient-to-br from-amber-500/15 to-orange-500/15 border-amber-400/50 shadow-[0_0_25px_rgba(251,191,36,0.2)]'
                : 'bg-slate-900/60 border-slate-700/50'
            }`}>

                earned ? 'bg-gradient-to-br from-amber-400 to-orange-500 text-slate-900' : 'bg-slate-800 text-slate-600'
              }`}>
                {earned ? <Icon className="w-6 h-6" strokeWidth={2.4} /> : <Lock className="w-5 h-5" />}
              </div>
              <h3 className={`font-display text-lg tracking-wide ${earned ? 'text-amber-200' : 'text-slate-400'}`}>{a.name}</h3>
              <p className="text-sm text-slate-400 mt-1">{a.desc}</p>
              {earned && <div className="absolute top-3 right-3 text-[10px] tracking-widest text-amber-300 font-display">UNLOCKED</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}
