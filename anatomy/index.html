    #boot {

      z-index: 999; background: #1a0816; transition: opacity 0.4s;

    #boot .ring {
      width: 64px; height: 64px; border-radius: 50%;

    @keyframes slideup {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slidein {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }

    @keyframes xpfloat {
      0%   { opacity: 0; transform: translate(-50%, 10px) scale(0.85); }
      20%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
      80%  { opacity: 1; transform: translate(-50%, -8px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -28px) scale(0.95); }
    }
    .animate-xpfloat { animation: xpfloat 1.4s ease-out forwards; }

    .perspective-card { perspective: 1000px; }
    .transform-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    const { useState, useEffect, useRef, useMemo, useLayoutEffect } = React;

    function L({ name, className = '', size = 24, strokeWidth = 2, ...rest }) {
      const ref = useRef(null);
      useLayoutEffect(() => {
        if (!ref.current || !window.lucide) return;
        const lib = window.lucide;
        const node = lib.icons && lib.icons[name];
        if (!node) return;
        const svg = lib.createElement(node);
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        svg.setAttribute('stroke-width', strokeWidth);
        if (className) svg.setAttribute('class', className);
        ref.current.replaceChildren(svg);
      }, [name, size, strokeWidth, className]);
      return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', verticalAlign: 'middle' }} />;
    }

function Stat({ icon: Icon, label, value, color }) {
  return (
    <div className="stat-chip flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-700/60">
      <Icon className={`w-4 h-4 ${color}`} />
      <div className="leading-tight">
        <div className="stat-label text-[10px] uppercase tracking-widest text-slate-500">{label}</div>
        <div className={`stat-value font-display text-sm ${color}`}>{value}</div>
      </div>
    </div>
  );
}

function Section({ icon: Icon, title, children, color = 'text-rose-300' }) {
  return (
    <div>
      <div className="flex items-center gap-2 mb-1.5">
        <Icon className={`w-4 h-4 ${color}`} />
        <h3 className={`font-display text-xs tracking-[0.2em] uppercase ${color}`}>{title}</h3>
      </div>
      {children}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('body');
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [xp, setXp] = useState(0);
  const [discovered, setDiscovered] = useState(new Set());
  const [gamesWon, setGamesWon] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);
  const [unlockedAchievements, setUnlockedAchievements] = useState(new Set());
  const [toast, setToast] = useState(null);
  const [activeGame, setActiveGame] = useState(null);
  const [xpFloater, setXpFloater] = useState(null);
  const [hydrated, setHydrated] = useState(false);
  const [installPrompt, setInstallPrompt] = useState(null);

  const STORAGE_KEY = 'anatomy-lab-v1';
  const state = { xp, discovered, gamesWon, bestStreak };
  const level = xpToLevel(xp);
  const lvlPct = xpInLevel(xp);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (typeof d.xp === 'number') setXp(d.xp);
        if (Array.isArray(d.discovered)) setDiscovered(new Set(d.discovered));
        if (typeof d.gamesWon === 'number') setGamesWon(d.gamesWon);
        if (typeof d.bestStreak === 'number') setBestStreak(d.bestStreak);
        if (Array.isArray(d.unlocked)) setUnlockedAchievements(new Set(d.unlocked));
      }
    } catch {}
    setHydrated(true);
  }, []);

  useEffect(() => {
    if (!hydrated) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        xp, discovered:[...discovered], gamesWon, bestStreak,
        unlocked:[...unlockedAchievements]
      }));
    } catch {}
  }, [hydrated, xp, discovered, gamesWon, bestStreak, unlockedAchievements]);

  useEffect(() => {
    ACHIEVEMENTS.forEach(a => {
      if (!unlockedAchievements.has(a.id) && a.check(state)) {
        setUnlockedAchievements(prev => new Set(prev).add(a.id));
        setToast({ name:a.name, desc:a.desc, icon:a.icon });
        setTimeout(() => setToast(null), 4200);
      }
    });
  }, [xp, discovered, gamesWon, bestStreak]);

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener('beforeinstallprompt', handler);
    window.addEventListener('appinstalled', () => setInstallPrompt(null));
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const installApp = async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    setInstallPrompt(null);
  };

  const grantXp = (amount, reason='') => {
    setXp(x => x + amount);
    setXpFloater({ amount, reason, id: Date.now() });
    setTimeout(() => setXpFloater(null), 1400);
  };

  const openPart = el => {
    setSelected(el);
    if (!discovered.has(el.id)) {
      setDiscovered(prev => new Set(prev).add(el.id));
      grantXp(5, `Found ${el.name}!`);
    }
  };

  const resetProgress = () => {
    if (!confirm('Reset all progress? This cannot be undone.')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    setXp(0); setDiscovered(new Set()); setGamesWon(0); setBestStreak(0);
    setUnlockedAchievements(new Set());
  };

  const filteredParts = useMemo(() => {
    return BODY_PARTS.filter(b => {
      if (filter !== 'all' && b.sys !== filter) return false;
      if (search) {
        const q = search.toLowerCase();
        return b.name.toLowerCase().includes(q) || b.sys.toLowerCase().includes(q);
      }
      return true;
    });
  }, [filter, search]);
  const filteredSet = useMemo(() => new Set(filteredParts.map(p => p.id)), [filteredParts]);

  return (
    <div className="min-h-screen w-full text-slate-100 relative overflow-x-hidden font-body">
      <BackgroundFx />
      <header className="relative z-10 border-b border-rose-400/20 bg-slate-950/60 backdrop-blur-xl">
        <div className="header-pad max-w-[1400px] mx-auto px-3 sm:px-6 py-4 flex flex-wrap items-center gap-3 sm:gap-4">
          <div className="flex items-center gap-3">
            <div className="relative w-10 h-10 sm:w-12 sm:h-12 grid place-items-center rounded-xl bg-gradient-to-br from-rose-400 to-fuchsia-500 shadow-[0_0_30px_rgba(244,63,94,0.5)]">
              <Heart className="w-5 h-5 sm:w-7 sm:h-7 text-white" strokeWidth={2.5} />
              <span className="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-emerald-400 animate-pulse" />
            </div>
            <div>
              <h1 className="font-display text-lg sm:text-2xl tracking-[0.18em] leading-none bg-gradient-to-r from-rose-300 via-fuchsia-300 to-amber-300 bg-clip-text text-transparent">
                ANATOMY LAB
              </h1>
              <p className="text-[10px] sm:text-[11px] tracking-[0.3em] text-slate-400 mt-1">BODY EXPLORER</p>
            </div>
          </div>
          <div className="ml-auto flex items-center gap-2 sm:gap-5 flex-wrap">
            {installPrompt && (
              <button onClick={installApp}
                className="px-3 py-1.5 rounded-lg bg-gradient-to-r from-rose-500 to-fuchsia-500 text-white font-display text-xs tracking-widest flex items-center gap-1.5 shadow-[0_0_20px_rgba(244,63,94,0.4)] hover:scale-105 transition-transform">
                <Sparkles className="w-3.5 h-3.5" /> INSTALL
              </button>
            )}
            <Stat icon={Sparkles} label="XP"       value={xp}             color="text-rose-300" />
            <Stat icon={Star}     label="Level"    value={level}          color="text-amber-300" />
            <Stat icon={Stethoscope} label="Found" value={`${discovered.size}/${BODY_PARTS.length}`} color="text-emerald-300" />
            <Stat icon={Trophy}   label="Trophies" value={`${unlockedAchievements.size}/${ACHIEVEMENTS.length}`} color="text-fuchsia-300" />
          </div>
        </div>
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 pb-3">
          <div className="h-1.5 rounded-full bg-slate-800/80 overflow-hidden">
            <div className="h-full bg-gradient-to-r from-rose-400 via-fuchsia-400 to-amber-400 transition-all duration-700"
                 style={{ width: `${lvlPct}%` }} />
          </div>
        </div>
        <nav className="max-w-[1400px] mx-auto px-4 sm:px-6 pb-3 flex gap-2 flex-wrap">
          {[
            { id:'body',   label:'Body Map',     icon:Heart },
            { id:'list',   label:'List View',    icon:BookOpen },
            { id:'games',  label:'Games',        icon:Target },
            { id:'trophy', label:'Achievements', icon:Trophy },
            { id:'about',  label:'How To Play',  icon:Lightbulb },
          ].map(t => (
            <button key={t.id} onClick={() => { setTab(t.id); setActiveGame(null); }}
              className={`group px-4 py-2 rounded-lg flex items-center gap-2 text-sm tracking-wider uppercase transition-all border ${
                tab === t.id
                  ? 'bg-rose-400/15 border-rose-400/60 text-rose-200 shadow-[0_0_20px_rgba(244,63,94,0.3)]'
                  : 'border-slate-700/60 text-slate-400 hover:text-slate-200 hover:border-slate-500'
              }`}>
              <t.icon className="w-4 h-4" />
              <span className="font-display text-xs">{t.label}</span>
            </button>
          ))}
        </nav>
      </header>
      <main className="relative z-10 max-w-[1400px] mx-auto px-2 sm:px-6 py-6">
        {tab === 'body' && <BodyDiagram parts={BODY_PARTS} discovered={discovered} filter={filter} setFilter={setFilter} onSelect={openPart} />}
        {tab === 'list' && <ListView parts={filteredParts} filter={filter} setFilter={setFilter} search={search} setSearch={setSearch} discovered={discovered} onSelect={openPart} />}
        {tab === 'games' && !activeGame && <GamesHub onStart={setActiveGame} />}
        {tab === 'games' && activeGame === 'diagnose' && <DiagnoseGame onExit={() => setActiveGame(null)} grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} bestStreak={bestStreak} setBestStreak={setBestStreak} />}
        {tab === 'games' && activeGame === 'detective' && <DetectiveGame onExit={() => setActiveGame(null)} grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} bestStreak={bestStreak} setBestStreak={setBestStreak} />}
        {tab === 'games' && activeGame === 'speed' && <SpeedGame onExit={() => setActiveGame(null)} grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} />}
        {tab === 'games' && activeGame === 'memory' && <MemoryGame onExit={() => setActiveGame(null)} grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} />}
        {tab === 'trophy' && <AchievementsView state={state} unlocked={unlockedAchievements} />}
        {tab === 'about' && <AboutView resetProgress={resetProgress} />}
      </main>
      {selected && <BodyPartModal part={selected} onClose={() => setSelected(null)} />}
      {toast && <AchievementToast toast={toast} />}
      {xpFloater && (
        <div key={xpFloater.id} className="fixed top-24 left-1/2 -translate-x-1/2 z-[60] pointer-events-none">
          <div className="px-4 py-2 rounded-full bg-rose-500/95 text-white font-display tracking-wider text-sm shadow-[0_0_30px_rgba(244,63,94,0.7)] animate-xpfloat">
            +{xpFloater.amount} XP {xpFloater.reason && <span className="opacity-90 normal-case font-body ml-1">{xpFloater.reason}</span>}
          </div>
        </div>
      )}
    </div>
  );
}

function DiagnoseGame({ onExit, grantXp, onWin, bestStreak, setBestStreak }) {
  const ROUNDS = 6;
  const [round, setRound] = useState(0);
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [puzzle, setPuzzle] = useState(null);
  const [picked, setPicked] = useState(null);

  useEffect(() => { newRound(); }, []);
  function newRound() {
    const answer = rand(BODY_PARTS);
    const wrong = shuffle(BODY_PARTS.filter(p => p.id !== answer.id)).slice(0, 3);
    setPuzzle({ answer, choices: shuffle([answer, ...wrong]) });
    setPicked(null);
  }
  function pick(p) {
    if (picked) return;
    setPicked(p);
    const right = p.id === puzzle.answer.id;
    if (right) {

  useEffect(() => { newRound(); }, []);
  function newRound() {
    const answer = rand(BODY_PARTS);
    const wrong = shuffle(BODY_PARTS.filter(p => p.id !== answer.id)).slice(0, 3);
    setPuzzle({ answer, choices: shuffle([answer, ...wrong]) });
    setPicked(null);
  }
  function pick(p) {
    if (picked) return;
    setPicked(p);
    const right = p.id === puzzle.answer.id;
    if (right) {
      setScore(s => s + 1);
      const ns = streak + 1; setStreak(ns);
      if (ns > bestStreak) setBestStreak(ns);
      grantXp(15, 'Solved!');
    } else { setStreak(0); }
    setTimeout(() => {
      if (round + 1 >= ROUNDS) {
        if (score + (right ? 1 : 0) >= 4) onWin();
        setRound(ROUNDS);
      } else {
        setRound(r => r + 1); newRound();
      }
    }, 1500);
  }
  if (!puzzle) return null;
  if (round >= ROUNDS) {
    return <GameResult title="Detective Closed The Case" score={score} total={`out of ${ROUNDS}`}
      message={score >= 4 ? 'Excellent deduction.' : 'Good run. Try again.'}

      <div className="mt-6 max-w-3xl mx-auto">

          <Clue n={2} text={`My job is: ${puzzle.answer.job.split('.')[0]}.`} />
          <Clue n={3} text={puzzle.answer.fact} />

        <div className="mt-5 grid grid-cols-2 sm:grid-cols-4 gap-3">

            const sys = SYSTEMS[c.sys];

            return (
              <button key={c.id} onClick={() => pick(c)} disabled={!!picked}

function SpeedGame({ onExit, grantXp, onWin }) {
  const [time, setTime] = useState(45);
  const [score, setScore] = useState(0);
  const [over, setOver] = useState(false);
  const [puzzle, setPuzzle] = useState(null);
  const [picked, setPicked] = useState(null);

  useEffect(() => { newPuzzle(); }, []);
  useEffect(() => {
    if (over) return;
    if (time <= 0) { setOver(true); grantXp(score * 5, 'Speed bonus!'); if (score >= 8) onWin(); return; }
    const t = setTimeout(() => setTime(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [time, over]);
  function newPuzzle() {
    const answer = rand(BODY_PARTS);
    const others = shuffle(BODY_PARTS.filter(p => p.id !== answer.id)).slice(0, 3);
    setPuzzle({ answer, choices: shuffle([answer, ...others]) });
    setPicked(null);
  }
  function pick(p) {
    if (picked || over) return;
    setPicked(p);
    if (p.id === puzzle.answer.id) { setScore(s => s + 1); setTimeout(newPuzzle, 350); }
    else { setTime(t => Math.max(0, t - 3)); setTimeout(newPuzzle, 600); }
  }
  if (over) return <GameResult title="Time's Up!" score={score} total="matches" message={score >= 8 ? 'Lightning reflexes!' : 'Faster next time?'}
    onPlayAgain={() => { setScore(0); setTime(45); setOver(false); newPuzzle(); }} onExit={onExit} accent="rose" />;
  if (!puzzle) return null;
  const sys = SYSTEMS[puzzle.answer.sys];
  return (
    <div>
      <GameHeader onExit={onExit} title="Body Builder Speed" extra={<div className="flex items-center gap-2 text-amber-300"><Timer className="w-4 h-4" /><span className="font-display text-lg tabular-nums">{time}s</span></div>} score={score} />
      <div className="mt-6 max-w-2xl mx-auto">
        <div className="text-center mb-1 text-xs tracking-widest text-slate-400 font-display">WHICH BODY PART IS THIS?</div>
        <div className={`mx-auto w-40 h-40 rounded-2xl bg-gradient-to-br ${sys.tile} grid place-items-center shadow-[0_0_50px_rgba(244,63,94,0.3)] mb-6`}>
          <div className="text-7xl">{puzzle.answer.emoji}</div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          {puzzle.choices.map(c => {
            const isAnswer = picked && c.id === puzzle.answer.id;
            const isWrong = picked && picked.id === c.id && c.id !== puzzle.answer.id;
            return (
              <button key={c.id} onClick={() => pick(c)} disabled={!!picked}
                className={`p-4 rounded-xl text-left transition-all border ${
                  picked ? (
                    isAnswer ? 'bg-emerald-500/30 border-emerald-400' :
                    isWrong ? 'bg-red-500/30 border-red-400' :
                    'opacity-50 border-slate-700'
                  ) : 'bg-slate-900/70 border-slate-700/60 hover:border-rose-400/60'
                }`}>
                <div className="font-display text-lg text-white">{c.name}</div>
                <div className="text-xs text-slate-400 mt-0.5">{SYSTEMS[c.sys].label}</div>
              </button>
            );
          })}
        </div>
        <div className="mt-4 text-center text-xs text-slate-500">Wrong answer = -3 seconds.</div>
      </div>
    </div>
  );
}

function MemoryGame({ onExit, grantXp, onWin }) {
  const [cards, setCards] = useState([]);
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState(new Set());
  const [moves, setMoves] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => { reset(); }, []);
  function reset() {
    const picks = shuffle(BODY_PARTS).slice(0, 8);
    const sym = picks.map(p => ({ id:`s-${p.id}`, kind:'emoji', p }));
    const nm = picks.map(p => ({ id:`n-${p.id}`, kind:'name', p }));
    setCards(shuffle([...sym, ...nm]));
    setFlipped([]); setMatched(new Set()); setMoves(0); setDone(false);
  }
  function flip(card) {
    if (flipped.length === 2 || flipped.find(c => c.id === card.id) || matched.has(card.p.id)) return;
    const nf = [...flipped, card];
    setFlipped(nf);
    if (nf.length === 2) {
      setMoves(m => m + 1);
      const [a, b] = nf;
      if (a.p.id === b.p.id && a.kind !== b.kind) {
        const next = new Set(matched).add(a.p.id);
        setTimeout(() => {
          setMatched(next); setFlipped([]); grantXp(8, 'Match!');
          if (next.size === 8) {
            setDone(true); onWin();
            const bonus = Math.max(0, 15 - moves) * 5;
            if (bonus) grantXp(bonus, 'Efficiency bonus');
          }
        }, 600);
      } else {
        setTimeout(() => setFlipped([]), 900);
      }
    }
  }
  if (done) return <GameResult title="Memory Master!" score={moves} total="moves"
    message={moves <= 12 ? 'Photographic memory!' : 'Solid work.'}
    onPlayAgain={reset} onExit={onExit} accent="rose" />;
  return (
    <div>
      <GameHeader onExit={onExit} title="Anatomy Memory"
        extra={<div className="text-sm text-slate-300">Moves: <span className="font-display text-amber-300">{moves}</span></div>}
        score={`${matched.size}/8`} />
      <div className="mt-6 max-w-3xl mx-auto grid grid-cols-4 gap-2 sm:gap-3">
        {cards.map(card => {
          const isFlipped = flipped.find(c => c.id === card.id) || matched.has(card.p.id);
          const isMatched = matched.has(card.p.id);
          const sys = SYSTEMS[card.p.sys];
          return (
            <button key={card.id} onClick={() => flip(card)}
              className={`aspect-square rounded-xl transition-all duration-500 perspective-card ${isMatched ? 'opacity-60' : ''}`}>
              <div className={`relative w-full h-full transition-transform duration-500 transform-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                <div className="absolute inset-0 backface-hidden rounded-xl bg-slate-900/80 border border-slate-700/60 grid place-items-center hover:border-rose-400/50">
                  <Heart className="w-7 h-7 text-slate-600" />
                </div>
                <div className={`absolute inset-0 backface-hidden rotate-y-180 rounded-xl bg-gradient-to-br ${sys.tile} grid place-items-center p-2`}>
                  {card.kind === 'emoji' ? <div className="text-4xl">{card.p.emoji}</div>
                    : <div className="text-center"><div className="font-display text-sm text-white">{card.p.name}</div></div>}
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}
