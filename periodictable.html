    const { useState, useEffect, useRef, useMemo, useLayoutEffect } = React;

    /* ======================================================================
       Lucide icon component — wraps lucide.createElement output as an SVG
       ====================================================================== */
    function L({ name, className = '', size = 24, strokeWidth = 2, ...rest }) {
      const ref = useRef(null);
      useLayoutEffect(() => {
        if (!ref.current || !window.lucide) return;
        const lib = window.lucide;
        // The UMD build exposes lucide.icons[PascalName] as the icon node
        const node = lib.icons && lib.icons[name];
        if (!node) return;
        const svg = lib.createElement(node);
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        svg.setAttribute('stroke-width', strokeWidth);
        if (className) svg.setAttribute('class', className);
        // Replace any existing children
        ref.current.replaceChildren(svg);
      }, [name, size, strokeWidth, className]);
      return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', verticalAlign: 'middle' }} />;
    }

    const ChevronRight  = (p) => <L name="ChevronRight" {...p} />;
    const Lock          = (p) => <L name="Lock" {...p} />;
    const Lightbulb     = (p) => <L name="Lightbulb" {...p} />;
    const Heart         = (p) => <L name="Heart" {...p} />;

/* =========================================================================

  alkaline:         { label: 'Alkaline Earth',       tile: 'from-orange-500 to-amber-600',    glow: 'rgba(249,115,22,0.5)',  text: 'text-orange-200' },
  transition:       { label: 'Transition Metal',     tile: 'from-sky-500 to-blue-600',        glow: 'rgba(14,165,233,0.5)',  text: 'text-sky-200' },
  'post-transition':{ label: 'Post-Transition',      tile: 'from-emerald-500 to-green-600',   glow: 'rgba(16,185,129,0.5)',  text: 'text-emerald-200' },
  metalloid:        { label: 'Metalloid',            tile: 'from-teal-500 to-cyan-600',       glow: 'rgba(20,184,166,0.5)',  text: 'text-teal-200' },
  nonmetal:         { label: 'Nonmetal',             tile: 'from-yellow-400 to-amber-500',    glow: 'rgba(250,204,21,0.55)', text: 'text-yellow-200' },

  lanthanide:       { label: 'Lanthanide',           tile: 'from-pink-500 to-rose-500',       glow: 'rgba(236,72,153,0.5)',  text: 'text-pink-200' },

  null,
  { label: 'Safe',         color: 'text-emerald-400', icon: Shield,        bg: 'bg-emerald-500/15 border-emerald-400/40' },
  { label: 'Mostly Safe',  color: 'text-lime-400',    icon: Shield,        bg: 'bg-lime-500/15 border-lime-400/40' },
  { label: 'Be Careful',   color: 'text-yellow-400',  icon: AlertTriangle, bg: 'bg-yellow-500/15 border-yellow-400/40' },
  { label: 'Dangerous',    color: 'text-orange-400',  icon: Flame,         bg: 'bg-orange-500/15 border-orange-400/40' },
  { label: 'EXTREME',      color: 'text-red-400',     icon: Skull,         bg: 'bg-red-500/15 border-red-400/40' },
];

/* =========================================================================
   Achievements
   ========================================================================= */
const ACHIEVEMENTS = [
  { id: 'first',         name: 'First Spark',          desc: 'Discover your first element',     icon: Sparkles,   check: s => s.discovered.size >= 1 },
  { id: 'ten',           name: 'Curious Mind',         desc: 'Discover 10 elements',            icon: Brain,      check: s => s.discovered.size >= 10 },
  { id: 'fifty',         name: 'Element Explorer',     desc: 'Discover 50 elements',            icon: Microscope, check: s => s.discovered.size >= 50 },
  { id: 'hundred',       name: 'Atomic Adventurer',    desc: 'Discover 100 elements',           icon: Atom,       check: s => s.discovered.size >= 100 },
  { id: 'all',           name: 'Periodic Master',      desc: 'Discover all 118 elements',       icon: Crown,      check: s => s.discovered.size >= 118 },
  { id: 'noble',         name: 'Royal Treatment',      desc: 'Find every noble gas',            icon: Star,       check: s => ELEMENTS.filter(e=>e.cat==='noble').every(e=>s.discovered.has(e.n)) },
  { id: 'alkali',        name: 'Reactive Rebel',       desc: 'Find every alkali metal',         icon: Flame,      check: s => ELEMENTS.filter(e=>e.cat==='alkali').every(e=>s.discovered.has(e.n)) },
  { id: 'halogen',       name: 'Halogen Hunter',       desc: 'Find every halogen',              icon: Target,     check: s => ELEMENTS.filter(e=>e.cat==='halogen').every(e=>s.discovered.has(e.n)) },
  { id: 'firstWin',      name: 'Game On',              desc: 'Win your first game',             icon: Trophy,     check: s => s.gamesWon >= 1 },
  { id: 'fiveWins',      name: 'On a Roll',            desc: 'Win 5 games',                     icon: Zap,        check: s => s.gamesWon >= 5 },
  { id: 'detective',     name: 'Element Detective',    desc: 'Score 5 in a row in Detective',   icon: Lightbulb,  check: s => s.detectiveStreak >= 5 },
  { id: 'level5',        name: 'Lab Assistant',        desc: 'Reach Level 5',                   icon: Award,      check: s => Math.floor(s.xp / 100) + 1 >= 5 },
];

/* =========================================================================
   Helpers
   ========================================================================= */
const xpToLevel = xp => Math.floor(xp / 100) + 1;
const xpInLevel = xp => xp % 100;
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

/* =========================================================================
   Main App
   ========================================================================= */
function App() {
  const [tab, setTab] = useState('table');
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [xp, setXp] = useState(0);
  const [discovered, setDiscovered] = useState(new Set());
  const [gamesWon, setGamesWon] = useState(0);
  const [detectiveStreak, setDetectiveStreak] = useState(0);
  const [unlockedAchievements, setUnlockedAchievements] = useState(new Set());
  const [toast, setToast] = useState(null);
  const [activeGame, setActiveGame] = useState(null);
  const [xpFloater, setXpFloater] = useState(null);

  const state = { xp, discovered, gamesWon, detectiveStreak };
  const level = xpToLevel(xp);
  const lvlPct = xpInLevel(xp);

  // Check achievements after every state change
  useEffect(() => {
    ACHIEVEMENTS.forEach(a => {
      if (!unlockedAchievements.has(a.id) && a.check(state)) {
        setUnlockedAchievements(prev => new Set(prev).add(a.id));
        setToast({ kind: 'achievement', name: a.name, desc: a.desc, icon: a.icon });
        setTimeout(() => setToast(null), 4200);
      }
    });
    // eslint-disable-next-line
  }, [xp, discovered, gamesWon, detectiveStreak]);

  const grantXp = (amount, reason = '') => {
    setXp(x => x + amount);
    setXpFloater({ amount, reason, id: Date.now() });
    setTimeout(() => setXpFloater(null), 1400);
  };

  const openElement = el => {
    setSelected(el);
    if (!discovered.has(el.n)) {
      setDiscovered(prev => new Set(prev).add(el.n));
      grantXp(5, `Discovered ${el.name}!`);
    }
  };

  const filteredElements = useMemo(() => {
    return ELEMENTS.filter(e => {
      if (filter !== 'all' && e.cat !== filter) return false;
      if (search) {
        const q = search.toLowerCase();
        return e.name.toLowerCase().includes(q) ||
               e.s.toLowerCase().includes(q) ||
               String(e.n).includes(q);
      }
      return true;
    });
  }, [filter, search]);
  const filteredSet = useMemo(() => new Set(filteredElements.map(e => e.n)), [filteredElements]);

  return (
    <div className="min-h-screen w-full text-slate-100 relative overflow-x-hidden font-body">
      <Style />
      <BackgroundFx />

      {/* HEADER */}
      <header className="relative z-10 border-b border-cyan-400/20 bg-slate-950/60 backdrop-blur-xl">
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center gap-4">
          <div className="flex items-center gap-3">
            <div className="relative w-12 h-12 grid place-items-center rounded-xl bg-gradient-to-br from-cyan-400 to-fuchsia-500 shadow-[0_0_30px_rgba(34,211,238,0.5)]">
              <Atom className="w-7 h-7 text-slate-900" strokeWidth={2.5} />
              <span className="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-emerald-400 animate-pulse" />
            </div>
            <div>
              <h1 className="font-display text-xl sm:text-2xl tracking-[0.18em] leading-none bg-gradient-to-r from-cyan-300 via-fuchsia-300 to-amber-300 bg-clip-text text-transparent">
                ATOMIC LAB
              </h1>
              <p className="text-[11px] tracking-[0.3em] text-slate-400 mt-1">PERIODIC EXPLORER</p>
            </div>
          </div>

          <div className="ml-auto flex items-center gap-3 sm:gap-5 flex-wrap">
            <Stat icon={Sparkles} label="XP"        value={xp}                color="text-cyan-300" />
            <Stat icon={Star}     label="Level"     value={level}             color="text-amber-300" />
            <Stat icon={Beaker}   label="Found"     value={`${discovered.size}/118`} color="text-emerald-300" />
            <Stat icon={Trophy}   label="Trophies"  value={`${unlockedAchievements.size}/${ACHIEVEMENTS.length}`} color="text-fuchsia-300" />
          </div>
        </div>

        {/* Level progress */}
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 pb-3">
          <div className="h-1.5 rounded-full bg-slate-800/80 overflow-hidden">
            <div className="h-full bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-amber-400 transition-all duration-700"
                 style={{ width: `${lvlPct}%` }} />
          </div>
        </div>

        {/* Tabs */}
        <nav className="max-w-[1400px] mx-auto px-4 sm:px-6 pb-3 flex gap-2 flex-wrap">
          {[
            { id: 'table',  label: 'Periodic Table', icon: Atom },
            { id: 'games',  label: 'Games',          icon: Target },
            { id: 'trophy', label: 'Achievements',   icon: Trophy },
            { id: 'about',  label: 'How To Play',    icon: BookOpen },
          ].map(t => (
            <button
              key={t.id}
              onClick={() => { setTab(t.id); setActiveGame(null); }}
              className={`group px-4 py-2 rounded-lg flex items-center gap-2 text-sm tracking-wider uppercase transition-all border ${
                tab === t.id
                  ? 'bg-cyan-400/15 border-cyan-400/60 text-cyan-200 shadow-[0_0_20px_rgba(34,211,238,0.3)]'
                  : 'border-slate-700/60 text-slate-400 hover:text-slate-200 hover:border-slate-500'
              }`}>
              <t.icon className="w-4 h-4" />
              <span className="font-display text-xs">{t.label}</span>
            </button>
          ))}
        </nav>
      </header>

      {/* MAIN */}
      <main className="relative z-10 max-w-[1400px] mx-auto px-2 sm:px-6 py-6">
        {tab === 'table' && (
          <TableView
            filter={filter} setFilter={setFilter}
            search={search} setSearch={setSearch}
            elements={filteredElements} filteredSet={filteredSet}
            allElements={ELEMENTS} discovered={discovered}
            onSelect={openElement}
          />
        )}
        {tab === 'games' && !activeGame && <GamesHub onStart={setActiveGame} />}
        {tab === 'games' && activeGame === 'detective' && (
          <DetectiveGame onExit={() => setActiveGame(null)}
            grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)}
            streak={detectiveStreak} setStreak={setDetectiveStreak} />
        )}
        {tab === 'games' && activeGame === 'speed' && (
          <SpeedMatchGame onExit={() => setActiveGame(null)}
            grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} />
        )}
        {tab === 'games' && activeGame === 'mystery' && (
          <MysteryGame onExit={() => setActiveGame(null)}
            grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} />
        )}
        {tab === 'games' && activeGame === 'memory' && (
          <MemoryGame onExit={() => setActiveGame(null)}
            grantXp={grantXp} onWin={() => setGamesWon(g=>g+1)} />
        )}
        {tab === 'trophy' && (
          <AchievementsView state={state} unlocked={unlockedAchievements} />
        )}
        {tab === 'about' && <AboutView />}
      </main>

      {/* MODAL */}
      {selected && <ElementModal el={selected} onClose={() => setSelected(null)} />}

      {/* TOAST */}
      {toast && <AchievementToast toast={toast} />}

      {/* XP FLOATER */}
      {xpFloater && (
        <div key={xpFloater.id}
             className="fixed top-24 left-1/2 -translate-x-1/2 z-[60] pointer-events-none">
          <div className="px-4 py-2 rounded-full bg-cyan-500/95 text-slate-900 font-display tracking-wider text-sm shadow-[0_0_30px_rgba(34,211,238,0.7)] animate-xpfloat">
            +{xpFloater.amount} XP {xpFloater.reason && <span className="opacity-90 normal-case font-body ml-1">{xpFloater.reason}</span>}
          </div>
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   Background atmosphere
   ========================================================================= */
function BackgroundFx() {
  return (
    <>
      <div className="fixed inset-0 -z-10 bg-[#070b18]" />
      <div className="fixed inset-0 -z-10 opacity-60" style={{
        background: 'radial-gradient(900px 600px at 20% -10%, rgba(34,211,238,0.18), transparent 60%), radial-gradient(900px 700px at 110% 10%, rgba(217,70,239,0.16), transparent 60%), radial-gradient(800px 600px at 50% 130%, rgba(251,191,36,0.10), transparent 60%)'
      }} />
      <div className="fixed inset-0 -z-10" style={{
        backgroundImage: 'linear-gradient(rgba(34,211,238,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,0.06) 1px, transparent 1px)',
        backgroundSize: '48px 48px',
        maskImage: 'radial-gradient(ellipse 80% 60% at 50% 50%, black, transparent)'
      }} />
      <div className="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        {Array.from({ length: 30 }).map((_, i) => (
          <span key={i} className="absolute block rounded-full bg-cyan-300/40 animate-twinkle"
                style={{
                  width: `${Math.random() * 3 + 1}px`,
                  height: `${Math.random() * 3 + 1}px`,
                  top: `${Math.random() * 100}%`,
                  left: `${Math.random() * 100}%`,
                  animationDelay: `${Math.random() * 5}s`,
                  animationDuration: `${3 + Math.random() * 4}s`
                }} />
        ))}
      </div>

  );
}

/* =========================================================================
   Stat chip
   ========================================================================= */
function Stat({ icon: Icon, label, value, color }) {
  return (
    <div className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900/70 border border-slate-700/60">
      <Icon className={`w-4 h-4 ${color}`} />
      <div className="leading-tight">
        <div className="text-[10px] uppercase tracking-widest text-slate-500">{label}</div>
        <div className={`font-display text-sm ${color}`}>{value}</div>
      </div>
    </div>
  );
}

/* =========================================================================
   Periodic Table view
   ========================================================================= */
function TableView({ filter, setFilter, search, setSearch, elements, filteredSet, allElements, discovered, onSelect }) {
  return (
    <div>
      {/* Controls */}
      <div className="mb-5 flex flex-wrap items-center gap-3">
        <div className="relative flex-1 min-w-[220px] max-w-md">
          <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" />
          <input type="text" placeholder="Search by name, symbol, or number..."
                 value={search} onChange={e => setSearch(e.target.value)}
                 className="w-full pl-10 pr-3 py-2 rounded-lg bg-slate-900/70 border border-slate-700/60 focus:border-cyan-400/60 focus:outline-none text-sm tracking-wide placeholder:text-slate-500" />
        </div>
        <div className="flex flex-wrap gap-1.5">
          <FilterPill active={filter==='all'} onClick={()=>setFilter('all')} label="All" />
          {Object.entries(CATEGORIES).map(([k,v]) => (
            <FilterPill key={k} active={filter===k} onClick={()=>setFilter(k)} label={v.label} category={k} />
          ))}
        </div>
      </div>

      {/* Periodic Table grid */}
      <div className="overflow-x-auto pb-4 -mx-2 sm:mx-0">
        <div className="min-w-[1100px] px-2">
          <div className="grid gap-[3px]" style={{
            gridTemplateColumns: 'repeat(18, minmax(0, 1fr))',
            gridTemplateRows: 'repeat(7, auto) 14px repeat(2, auto)'
          }}>
            {allElements.map(el => (
              <ElementTile
                key={el.n}
                el={el}
                visible={filteredSet.has(el.n)}
                discovered={discovered.has(el.n)}
                onClick={() => onSelect(el)}
              />
            ))}
            {/* Lanthanide / Actinide labels */}
            <div className="col-start-3 row-start-6 grid place-items-center text-[10px] text-pink-300/70 tracking-widest">57-71</div>
            <div className="col-start-3 row-start-7 grid place-items-center text-[10px] text-fuchsia-300/70 tracking-widest">89-103</div>
          </div>
        </div>
      </div>

      {/* Legend */}
      <div className="mt-6 flex flex-wrap gap-2">
        {Object.entries(CATEGORIES).map(([k, v]) => (
          <div key={k} className="flex items-center gap-2 px-2.5 py-1 rounded-md bg-slate-900/60 border border-slate-700/50">
            <span className={`w-3 h-3 rounded bg-gradient-to-br ${v.tile}`} />
            <span className="text-[11px] tracking-wider text-slate-300">{v.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function FilterPill({ active, onClick, label, category }) {
  const cat = category && CATEGORIES[category];
  return (
    <button onClick={onClick}
      className={`px-2.5 py-1 rounded-md text-[11px] tracking-wider uppercase font-display transition-all border ${
        active
          ? 'bg-cyan-400/15 border-cyan-400/60 text-cyan-200'
          : 'border-slate-700/50 text-slate-400 hover:text-slate-200 hover:border-slate-500'
      }`}>
      {cat && <span className={`inline-block w-2 h-2 rounded-sm mr-1.5 align-middle bg-gradient-to-br ${cat.tile}`} />}
      {label}
    </button>
  );
}

function ElementTile({ el, visible, discovered, onClick }) {
  const cat = CATEGORIES[el.cat];
  const isDangerous = el.danger >= 4;
  return (
    <button
      onClick={onClick}
      style={{
        gridRow: el.row,
        gridColumn: el.col,
        '--glow': cat.glow,
      }}
      className={`relative aspect-square rounded-md p-1 sm:p-1.5 text-left group transition-all duration-300 ${
        visible
          ? `bg-gradient-to-br ${cat.tile} hover:scale-110 hover:z-20 hover:shadow-[0_0_25px_var(--glow)] cursor-pointer`
          : 'bg-slate-800/30 grayscale opacity-25 cursor-pointer'
      } ${discovered ? 'ring-1 ring-white/30' : ''}`}>
      <div className="flex flex-col h-full justify-between">
        <div className="flex items-start justify-between leading-none">
          <span className="font-mono text-[8px] sm:text-[9px] text-white/70">{el.n}</span>
          {isDangerous && visible && (
            <Radiation className="w-2.5 h-2.5 text-yellow-200 animate-pulse" strokeWidth={2.5} />
          )}
        </div>
        <div className="text-center">
          <div className="font-display font-bold text-sm sm:text-base lg:text-lg text-white drop-shadow leading-none">
            {el.s}
          </div>
          <div className="text-[7px] sm:text-[8px] text-white/85 truncate mt-0.5 tracking-wide">
            {el.name}
          </div>
        </div>
      </div>
      {discovered && visible && (
        <span className="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-emerald-400 ring-1 ring-emerald-200 shadow-[0_0_8px_rgba(52,211,153,0.9)]" />
      )}
    </button>
  );
}

/* =========================================================================
   Element detail modal
   ========================================================================= */
function ElementModal({ el, onClose }) {
  const cat = CATEGORIES[el.cat];
  const danger = DANGER_INFO[el.danger];
  const DangerIcon = danger.icon;

  useEffect(() => {
    const handle = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handle);
    return () => window.removeEventListener('keydown', handle);
  }, [onClose]);

  return (
    <div className="fixed inset-0 z-50 grid place-items-center p-4 animate-fadein" onClick={onClose}>
      <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-md" />
      <div onClick={e => e.stopPropagation()}
           className="relative w-full max-w-3xl bg-slate-900/95 border border-slate-700/60 rounded-2xl shadow-[0_0_60px_rgba(34,211,238,0.25)] overflow-hidden animate-slideup">

        {/* Top banner */}
        <div className={`relative bg-gradient-to-br ${cat.tile} p-6 sm:p-8 overflow-hidden`}>
          <button onClick={onClose} aria-label="Close" className="absolute top-3 right-3 z-10 p-2.5 rounded-full bg-black/40 hover:bg-black/60 text-white transition-colors">
            <X className="w-5 h-5" />
          </button>
          <div className="pointer-events-none absolute -bottom-10 -right-10 text-[180px] sm:text-[220px] font-display font-bold text-white/10 leading-none select-none">
            {el.s}
          </div>
          <div className="relative flex items-end gap-4 sm:gap-6">
            <div className="text-7xl sm:text-8xl">{el.emoji}</div>
            <div>
              <div className="font-mono text-xs text-white/80 tracking-widest">No. {el.n}  ·  {el.mass} u</div>
              <div className="font-display text-4xl sm:text-5xl text-white drop-shadow-lg leading-tight">{el.name}</div>
              <div className="mt-1 inline-block px-2 py-0.5 rounded-md bg-black/30 text-white/90 text-xs tracking-widest uppercase">
                {cat.label}
              </div>
            </div>
          </div>
        </div>

        {/* Body */}
        <div className="p-6 sm:p-8 space-y-5 max-h-[60vh] overflow-y-auto custom-scroll">
          <Section icon={BookOpen} title="What it is">
            <p className="text-slate-200 leading-relaxed">{el.desc}</p>
          </Section>

          <Section icon={Beaker} title="What it is used for">
            <p className="text-slate-200 leading-relaxed">{el.uses}</p>
          </Section>

          <Section icon={Lightbulb} title="Mind-Blowing Fact">
            <p className="font-fact text-amber-200 text-lg leading-relaxed">{el.fact}</p>
          </Section>

          <div className={`flex items-start gap-3 p-4 rounded-xl border ${danger.bg}`}>
            <DangerIcon className={`w-6 h-6 ${danger.color} flex-shrink-0 mt-0.5`} />

/* =========================================================================
   Game: Element Detective
   ========================================================================= */
function DetectiveGame({ onExit, grantXp, onWin, streak, setStreak }) {
  const [round, setRound] = useState(0);
  const [score, setScore] = useState(0);
  const [puzzle, setPuzzle] = useState(null);
  const [picked, setPicked] = useState(null);

  const ROUNDS = 7;

  useEffect(() => { newPuzzle(); /* eslint-disable-next-line */ }, []);

  function newPuzzle() {
    const answer = rand(ELEMENTS.filter(e => e.n <= 92)); // common elements
    const distractors = shuffle(ELEMENTS.filter(e => e.n !== answer.n && e.cat === answer.cat)).slice(0, 2);
    const fillers = shuffle(ELEMENTS.filter(e => e.n !== answer.n && !distractors.includes(e))).slice(0, 1);
    const choices = shuffle([answer, ...distractors, ...fillers]);
    setPuzzle({ answer, choices });
    setPicked(null);
  }

  function pick(el) {
    if (picked) return;
    setPicked(el);
    if (el.n === puzzle.answer.n) {
      setScore(s => s + 1);
      setStreak(s => s + 1);
      grantXp(15, 'Correct!');
    } else {
      setStreak(0);
    }
    setTimeout(() => {
      if (round + 1 >= ROUNDS) {
        if (score + (el.n === puzzle.answer.n ? 1 : 0) >= 4) onWin();
        const finalBonus = Math.max(0, score + (el.n === puzzle.answer.n ? 1 : 0) - 3) * 10;
        if (finalBonus) grantXp(finalBonus, 'End-of-round bonus');
        setRound(ROUNDS);
      } else {
        setRound(r => r + 1);
        newPuzzle();
      }
    }, 1500);
  }

  if (!puzzle) return null;

  if (round >= ROUNDS) {
    return (
      <GameResult
        title="Detective Closed The Case"
        score={score} total={ROUNDS}
        message={score >= 4 ? 'Sharp eye, Detective. You cracked the case.' : 'Good run. Try again to nail more clues.'}
        onPlayAgain={() => { setRound(0); setScore(0); newPuzzle(); }}
        onExit={onExit}
      />
    );
  }

  return (
    <div>
      <GameHeader onExit={onExit} title="Element Detective" round={round+1} total={ROUNDS} score={score} streak={streak} />

      <div className="mt-6 max-w-3xl mx-auto">
        <div className="p-6 sm:p-8 rounded-2xl bg-slate-900/70 border border-slate-700/60">
          <div className="text-xs tracking-widest text-cyan-300 mb-3 font-display">CASE FILE</div>
          <div className="space-y-3">
            <Clue n={1} text={`Category: ${CATEGORIES[puzzle.answer.cat].label}`} />
            <Clue n={2} text={`Used in: ${puzzle.answer.uses.split('.')[0].split(',').slice(0,2).join(', ')}`} />
            <Clue n={3} text={puzzle.answer.fact} />
          </div>
        </div>

        <div className="mt-5 grid grid-cols-2 sm:grid-cols-4 gap-3">
          {puzzle.choices.map(c => {
            const cat = CATEGORIES[c.cat];
            const isAnswer = picked && c.n === puzzle.answer.n;
            const isWrongPick = picked && picked.n === c.n && c.n !== puzzle.answer.n;
            return (
              <button key={c.n} onClick={() => pick(c)} disabled={!!picked}
                className={`p-4 rounded-xl text-center transition-all border ${
                  picked ? (
                    isAnswer ? 'bg-emerald-500/30 border-emerald-400 scale-105' :
                    isWrongPick ? 'bg-red-500/30 border-red-400' :
                    'opacity-40 border-slate-700'
                  ) : `bg-gradient-to-br ${cat.tile} border-transparent hover:scale-105`
                }`}>
                <div className="text-3xl">{c.emoji}</div>
                <div className="font-display text-2xl text-white mt-1">{c.s}</div>
                <div className="text-xs text-white/85 mt-0.5">{c.name}</div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Clue({ n, text }) {
  return (
    <div className="flex items-start gap-3 p-3 rounded-lg bg-slate-950/60 border border-slate-700/40">
      <div className="w-7 h-7 rounded-full bg-cyan-400/15 border border-cyan-400/40 grid place-items-center font-display text-cyan-300 text-xs flex-shrink-0">{n}</div>

/* =========================================================================
   Game: Symbol Speed Match
   ========================================================================= */
function SpeedMatchGame({ onExit, grantXp, onWin }) {
  const [time, setTime] = useState(45);
  const [score, setScore] = useState(0);
  const [over, setOver] = useState(false);
  const [puzzle, setPuzzle] = useState(null);
  const [picked, setPicked] = useState(null);

  useEffect(() => { newPuzzle(); /* eslint-disable-next-line */ }, []);

  useEffect(() => {
    if (over) return;
    if (time <= 0) {
      setOver(true);
      grantXp(score * 5, 'Speed bonus!');
      if (score >= 8) onWin();
      return;
    }
    const t = setTimeout(() => setTime(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [time, over, score, grantXp, onWin]);

  function newPuzzle() {
    const answer = rand(ELEMENTS.filter(e => e.n <= 86));
    const others = shuffle(ELEMENTS.filter(e => e.n !== answer.n)).slice(0, 3);
    setPuzzle({ answer, choices: shuffle([answer, ...others]) });
    setPicked(null);
  }

  function pick(el) {
    if (picked || over) return;
    setPicked(el);
    if (el.n === puzzle.answer.n) {
      setScore(s => s + 1);
      setTimeout(() => newPuzzle(), 350);
    } else {
      setTime(t => Math.max(0, t - 3));
      setTimeout(() => newPuzzle(), 600);
    }
  }

  if (over) {
    return (
      <GameResult
        title="Time's Up!"
        score={score} total={`${score} matches`}
        message={score >= 8 ? 'Lightning reflexes! That was incredible.' : 'Good run. Faster next time?'}
        onPlayAgain={() => { setScore(0); setTime(45); setOver(false); newPuzzle(); }}
        onExit={onExit}
      />
    );
  }
  if (!puzzle) return null;

  const cat = CATEGORIES[puzzle.answer.cat];

  return (
    <div>
      <GameHeader onExit={onExit} title="Symbol Speed Match" extra={
        <div className="flex items-center gap-2 text-amber-300">
          <Timer className="w-4 h-4" />
          <span className="font-display text-lg tabular-nums">{time}s</span>
        </div>
      } score={score} />

      <div className="mt-6 max-w-2xl mx-auto">
        <div className="text-center mb-1 text-xs tracking-widest text-slate-400 font-display">WHICH ELEMENT IS THIS?</div>
        <div className={`mx-auto w-40 h-40 rounded-2xl bg-gradient-to-br ${cat.tile} grid place-items-center shadow-[0_0_50px_var(--glow)] mb-6`} style={{'--glow': cat.glow}}>
          <div className="font-display text-7xl text-white drop-shadow-lg">{puzzle.answer.s}</div>
        </div>

        <div className="grid grid-cols-2 gap-3">
          {puzzle.choices.map(c => {
            const isAnswer = picked && c.n === puzzle.answer.n;
            const isWrong = picked && picked.n === c.n && c.n !== puzzle.answer.n;
            return (
              <button key={c.n} onClick={() => pick(c)} disabled={!!picked}
                className={`p-4 rounded-xl text-left transition-all border ${
                  picked ? (
                    isAnswer ? 'bg-emerald-500/30 border-emerald-400' :
                    isWrong ? 'bg-red-500/30 border-red-400' :
                    'opacity-50 border-slate-700'
                  ) : 'bg-slate-900/70 border-slate-700/60 hover:border-cyan-400/60 hover:bg-slate-800'
                }`}>
                <div className="font-display text-xl text-white">{c.name}</div>
                <div className="text-xs text-slate-400 mt-0.5">No. {c.n}</div>
              </button>
            );
          })}
        </div>
        <div className="mt-4 text-center text-xs text-slate-500">Wrong answer = -3 seconds. Be careful!</div>
      </div>
    </div>
  );
}

/* =========================================================================
   Game: Mystery Element (clues reveal one at a time)
   ========================================================================= */
function MysteryGame({ onExit, grantXp, onWin }) {
  const [round, setRound] = useState(0);
  const [score, setScore] = useState(0);
  const [revealed, setRevealed] = useState(1);
  const [puzzle, setPuzzle] = useState(null);
  const [picked, setPicked] = useState(null);
  const [input, setInput] = useState('');

  const ROUNDS = 5;

  useEffect(() => { newPuzzle(); /* eslint-disable-next-line */ }, []);

  function newPuzzle() {
    const answer = rand(ELEMENTS.filter(e => e.n <= 86));
    const clues = [
      `Atomic number: ${answer.n}`,
      `Category: ${CATEGORIES[answer.cat].label}`,
      `Atomic mass: ${answer.mass}`,
      `${answer.fact}`,
      `It is used for: ${answer.uses.split('.')[0]}.`,
      `Its symbol starts with the letter "${answer.s[0]}"`,
    ];
    setPuzzle({ answer, clues: shuffle(clues).slice(0, 5) });
    setRevealed(1);
    setPicked(null);
    setInput('');
  }

  function reveal() { setRevealed(r => Math.min(r + 1, 5)); }

  function submit() {
    if (picked) return;
    const ok = input.trim().toLowerCase() === puzzle.answer.name.toLowerCase()
            || input.trim().toLowerCase() === puzzle.answer.s.toLowerCase();
    setPicked(ok ? 'correct' : 'wrong');
    if (ok) {
      const points = (6 - revealed) * 10; // fewer clues = more points
      setScore(s => s + points);
      grantXp(points, `+${points} points`);
    }
    setTimeout(() => {
      if (round + 1 >= ROUNDS) {
        if (score >= 80) onWin();
        setRound(ROUNDS);
      } else {
        setRound(r => r + 1);
        newPuzzle();
      }
    }, 1900);
  }

  if (!puzzle) return null;

  if (round >= ROUNDS) {
    return (
      <GameResult
        title="Mystery Solved"
        score={score} total="points"
        message={score >= 100 ? 'Brilliant deduction! You barely needed any clues.' : 'Great work, keep training that detective brain.'}
        onPlayAgain={() => { setRound(0); setScore(0); newPuzzle(); }}
        onExit={onExit}
      />
    );
  }

  return (
    <div>
      <GameHeader onExit={onExit} title="Mystery Element" round={round+1} total={ROUNDS} score={score} extra={
        <div className="text-xs text-slate-400 font-display tracking-wider">CLUE {revealed}/5</div>
      } />

      <div className="mt-6 max-w-2xl mx-auto">
        <div className="p-6 rounded-2xl bg-slate-900/70 border border-slate-700/60 space-y-2">
          {puzzle.clues.slice(0, revealed).map((c, i) => (
            <div key={i} className="p-3 rounded-lg bg-slate-950/60 border border-slate-700/40 animate-slidein">
              <div className="text-[10px] tracking-widest text-cyan-300 mb-1 font-display">CLUE {i+1}</div>
              <div className="text-slate-200">{c}</div>
            </div>
          ))}
        </div>

        <div className="mt-4 flex flex-col sm:flex-row gap-3">
          <button onClick={reveal} disabled={revealed >= 5 || picked}
            className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-display tracking-wider disabled:opacity-40">
            Reveal Next Clue (-10 pts)
          </button>
          <div className="flex-1 flex gap-2">
            <input
              value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') submit(); }}
              placeholder="Element name or symbol..."
              disabled={!!picked}
              className={`flex-1 px-4 py-2 rounded-lg bg-slate-900 border focus:outline-none text-sm ${
                picked === 'correct' ? 'border-emerald-400' :
                picked === 'wrong' ? 'border-red-400' :
                'border-slate-700 focus:border-cyan-400/60'
              }`} />
            <button onClick={submit} disabled={!input || !!picked}
              className="px-4 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-display tracking-wider text-sm disabled:opacity-40">
              GUESS
            </button>
          </div>
        </div>
        {picked === 'correct' && <div className="mt-3 text-emerald-300 font-display tracking-wider">CORRECT! It was {puzzle.answer.name} ({puzzle.answer.s}).</div>}
        {picked === 'wrong' && <div className="mt-3 text-red-300 font-display tracking-wider">Not quite. It was {puzzle.answer.name} ({puzzle.answer.s}).</div>}
      </div>
    </div>
  );
}

/* =========================================================================
   Game: Atomic Memory (match symbol cards to name cards)
   ========================================================================= */
function MemoryGame({ onExit, grantXp, onWin }) {
  const [cards, setCards] = useState([]);
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState(new Set());
  const [moves, setMoves] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => { reset(); /* eslint-disable-next-line */ }, []);

  function reset() {
    const picks = shuffle(ELEMENTS.filter(e => e.n <= 36)).slice(0, 8);
    const symbolCards = picks.map(e => ({ id: `s-${e.n}`, kind: 'sym', el: e }));
    const nameCards   = picks.map(e => ({ id: `n-${e.n}`, kind: 'name', el: e }));
    setCards(shuffle([...symbolCards, ...nameCards]));
    setFlipped([]); setMatched(new Set()); setMoves(0); setDone(false);
  }

  function flip(card) {
    if (flipped.length === 2 || flipped.find(c => c.id === card.id) || matched.has(card.el.n)) return;
    const newFlipped = [...flipped, card];
    setFlipped(newFlipped);
    if (newFlipped.length === 2) {
      setMoves(m => m + 1);
      const [a, b] = newFlipped;
      if (a.el.n === b.el.n && a.kind !== b.kind) {
        const next = new Set(matched).add(a.el.n);
        setTimeout(() => {
          setMatched(next);
          setFlipped([]);
          grantXp(8, 'Match!');
          if (next.size === 8) {
            setDone(true);
            onWin();
            const efficiencyBonus = Math.max(0, 15 - moves) * 5;
            if (efficiencyBonus) grantXp(efficiencyBonus, 'Efficiency bonus');
          }
        }, 600);
      } else {
        setTimeout(() => setFlipped([]), 900);
      }
    }
  }

  if (done) {
    return (
      <GameResult
        title="Memory Master!"
        score={moves} total="moves"
        message={moves <= 12 ? 'Photographic memory! Incredible focus.' : 'Solid work. Try to do it in fewer moves!'}
        onPlayAgain={reset}
        onExit={onExit}
      />
    );
  }

  return (
    <div>
      <GameHeader onExit={onExit} title="Atomic Memory" extra={
        <div className="text-sm text-slate-300">Moves: <span className="font-display text-amber-300">{moves}</span></div>
      } score={`${matched.size}/8`} />

      <div className="mt-6 max-w-3xl mx-auto grid grid-cols-4 gap-2 sm:gap-3">
        {cards.map(card => {
          const isFlipped = flipped.find(c => c.id === card.id) || matched.has(card.el.n);
          const isMatched = matched.has(card.el.n);
          const cat = CATEGORIES[card.el.cat];
          return (
            <button key={card.id} onClick={() => flip(card)}
              className={`aspect-square rounded-xl transition-all duration-500 perspective-card ${isMatched ? 'opacity-60' : ''}`}>
              <div className={`relative w-full h-full transition-transform duration-500 transform-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                {/* Front (hidden) */}
                <div className="absolute inset-0 backface-hidden rounded-xl bg-slate-900/80 border border-slate-700/60 grid place-items-center hover:border-cyan-400/50">
                  <Atom className="w-7 h-7 text-slate-600" />
                </div>
                {/* Back (revealed) */}
                <div className={`absolute inset-0 backface-hidden rotate-y-180 rounded-xl bg-gradient-to-br ${cat.tile} grid place-items-center p-2`}>
                  {card.kind === 'sym' ? (
                    <div className="font-display text-2xl sm:text-4xl text-white">{card.el.s}</div>
                  ) : (
                    <div className="text-center">
                      <div className="font-display text-sm sm:text-base text-white">{card.el.name}</div>
                      <div className="text-[10px] text-white/80 mt-0.5">No. {card.el.n}</div>
                    </div>
                  )}
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

}
